<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Center Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .button-container {
            margin-top: 30px;
        }
        .game-button {
            display: inline-block;
            padding: 20px 40px;
            margin: 10px;
            font-size: 24px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .game-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Game Center</h1>
    <div class="button-container">
        <a href="game1.html" class="game-button">Game 1</a>
        <a href="game2.html" class="game-button">Game 2</a>
        <a href="game3.html" class="game-button">Game 3</a>
        <a href="game4.html" class="game-button">Game 4</a>
    </div>
</body>
</html>
